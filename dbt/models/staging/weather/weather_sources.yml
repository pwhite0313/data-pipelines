version: 2

sources:
  - name: raw
    database: weather_db
    description: "Raw weather forecast snapshots loaded from timestamped Airflow CSV outputs."
    schema: raw
    tables:
      - name: weather_forecast
        description: "Append-only raw forecast table populated from files like output_YYYYMMDD_HHMMSS.csv."
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 25, period: hour}
          error_after: {count: 49, period: hour}
